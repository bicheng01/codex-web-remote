<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Codex 远程控制</title><link rel="stylesheet" href="/assets/style-41e77b8fc9c6.css"></head>
<body><header><button id="back" class="icon-button chat-back" aria-label="返回工作区和任务" hidden>←</button><div class="header-info"><span class="brand">Codex 远程控制</span><span class="chat-heading" hidden>任务会话</span><p id="connection">连接中</p></div><button id="theme" class="icon-button" title="切换明暗主题">◐</button></header><main>
<section id="pairing" hidden><div class="intro"><p class="caption">移动端远程控制</p><h1>扫码，接着做。</h1><p>查看当前设备的工作区和任务，进入会话后继续操作。</p></div><div class="pairgrid"><div class="qrpanel"><img id="qr" alt="手机配对二维码" hidden><p id="pair-status">正在生成二维码</p></div><div class="pairinfo"><h2>连接当前设备</h2><p id="pair-title"></p><p class="muted" id="pair-expiry"></p><p id="network-help"></p><div class="actions"><button id="refresh">刷新二维码</button><button id="copy">复制链接</button><button id="revoke" class="secondary">停止远程控制</button></div><p id="pair-note" class="muted">停止远程控制会断开手机连接，电脑上的任务继续运行。</p></div></div></section>
<p id="error" role="alert" hidden></p>
<section id="home" hidden><div class="notice">本次连接可以查看当前设备上的本地项目、任务和会话。连接失效后，请回到桌面端重新扫码。</div><div class="home-heading"><div><h2>当前设备上的工作区和任务</h2><p id="counts" class="muted">正在加载</p></div><div class="home-actions"><button id="collapse" class="icon-button" title="折叠全部工作区">⌃</button><button id="filters" class="icon-button" title="筛选任务">☷</button><button id="reload" class="icon-button" title="刷新列表">↻</button></div></div><div id="filterbar" hidden><input id="search" type="search" placeholder="搜索工作区或任务"><label><input id="running" type="checkbox">仅显示运行中</label><label><input id="hide-empty" type="checkbox">隐藏空工作区</label></div><div id="workspaces"></div></section>
<section id="controller" hidden><div class="threadhead"><span class="task-folder" aria-hidden="true">▱</span><h2 id="title">正在连接 Desktop</h2><button id="thread-info" class="icon-button" aria-label="查看任务信息" aria-expanded="false">···</button><button id="timeline-toggle" class="icon-button" aria-label="折叠执行记录" aria-pressed="false">▥</button></div><div id="task-info" hidden><p id="metadata" class="muted"></p><p id="task-status"></p></div><div class="timeline"><div id="messages" aria-live="polite"><p class="empty">连接后显示会话内容</p></div><button id="jump-bottom" class="icon-button" aria-label="回到最新消息" hidden>↓</button></div><form id="composer"><label class="sr-only" for="prompt">发送消息</label><textarea id="prompt" placeholder="与codex协作" rows="3" maxlength="20000"></textarea><p id="hint">消息将在电脑上执行</p><div class="composerfoot"><span class="desktop-indicator" title="Desktop 连接状态">◉</span><div class="composer-tools"><button id="permission-open" type="button" class="tool-trigger permission-trigger" aria-label="权限设置" aria-haspopup="dialog"></button><div class="model-picker"><button id="model-open" type="button" class="tool-trigger model-trigger" aria-label="选择模型" aria-haspopup="listbox" aria-expanded="false" disabled><span id="model-label">Desktop 模型</span><span class="chevron" aria-hidden="true"></span></button><div id="model-menu" class="picker-menu" role="listbox" aria-label="选择模型" hidden></div></div></div><span id="activity" class="activity" aria-live="polite"></span><div class="composer-buttons"><button id="interrupt" class="icon-button stop-button" aria-label="停止任务" disabled>■</button><button id="send" type="submit" class="send-button" aria-label="发送" disabled>↑</button></div></div></form><div id="permissions-dialog" class="dialog-scrim" hidden><section class="permissions-card" role="dialog" aria-modal="true" aria-labelledby="permissions-title"><button id="permission-close" class="dialog-close" type="button" aria-label="关闭">×</button><h2 id="permissions-title">权限设置</h2><p class="permission-note">更改将用于下一轮消息；正在运行的任务不会改变。</p><select id="permission-mode" hidden aria-hidden="true"><option value="default">请求批准</option><option value="guardian">帮我批准</option><option value="full-access">完全访问权限</option><option id="permission-custom" value="custom">保留当前设置</option></select><div id="permission-options" role="radiogroup" aria-label="应如何批准 Codex 操作？"></div><p id="permission-description" class="permission-note"></p><label id="permission-warning" class="permission-warning"><input id="permission-ack" type="checkbox">我了解此模式会减少手动批准，或扩大访问权限</label><button id="permission-save" type="button" class="permission-save">应用到下一轮</button></section></div></section>
</main><script type="module" src="/assets/app-1f72d33656bc.js"></script></body></html>
